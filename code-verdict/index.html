<style>
  :root{
    --paper:#F2EAD8; --paper-deep:#E9DDC2; --ink:#2B2723; --ink-soft:#6B6155;
    --cinnabar:#A8332A; --cinnabar-deep:#8B2A22; --seal:#B03A2E;
    --gold:#8B6F2E; --line:#D8C9A5;

  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}

  #app{max-width:560px;margin:0 auto}

  /* ============ 堂头 ============ */
  header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 16px}

  .brand .seal-mini{

  .brand small{display:block;font-size:10px;color:var(--ink-soft);letter-spacing:3px;font-weight:600}
  .archive{font-size:12px;color:var(--ink-soft);font-weight:700;text-align:right;line-height:1.5}

  /* ============ 公堂区 ============ */
  .court{
    position:relative;background:rgba(255,252,244,.72);
    border:2px solid var(--line);border-radius:6px;
    box-shadow:var(--shadow);padding:26px 18px 22px;overflow:hidden;
  }
  .court::before{
    content:"";position:absolute;inset:8px;border:1px solid rgba(139,111,46,.35);pointer-events:none;
  }
  .court-head{text-align:center;margin-bottom:16px}
  .court-head .plaque{
    display:inline-block;background:var(--cinnabar);color:#F7EFDD;
    font-size:26px;font-weight:900;letter-spacing:8px;padding:10px 22px 10px 30px;
    border-radius:4px;box-shadow:0 6px 16px rgba(168,51,42,.30);text-indent:8px;
  }
  .court-head .creed{margin-top:12px;font-size:14px;color:var(--ink-soft);letter-spacing:2px}
  .gavel{font-size:34px;display:inline-block;animation:gavelIdle 2.8s ease-in-out infinite;transform-origin:70% 80%}
  @keyframes gavelIdle{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-14deg)}97%{transform:rotate(4deg)}}
  .court.striking .gavel{animation:gavelStrike .5s ease-out 2}
  @keyframes gavelStrike{0%{transform:rotate(0)}30%{transform:rotate(-32deg)}60%{transform:rotate(8deg)}100%{transform:rotate(0)}}

  .paper{
    position:relative;width:100%;min-height:180px;border:none;resize:vertical;
    background:linear-gradient(180deg,#FBF6EA,#F5EEDC);
    border:1.5px solid var(--line);border-radius:4px;
    padding:14px 14px;font-family:ui-monospace,"Cascadia Mono","Consolas","Courier New",monospace;
    font-size:12.5px;line-height:1.7;color:var(--ink);outline:none;

  }
  .paper:focus{border-color:var(--cinnabar);box-shadow:inset 0 2px 8px rgba(43,39,35,.06), 0 0 0 3px rgba(168,51,42,.12)}
  .paper::placeholder{color:#B7AA8F;font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:13px}

  .field-row{display:flex;gap:10px;margin-top:10px;align-items:center}

  .sin .s-text{margin-top:5px;font-size:13.5px;color:var(--ink-soft);line-height:1.7}

  .evidence{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ev{

  .v-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}

  /* Toast */
  #toasts{position:fixed;top:max(14px, env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,440px);pointer-events:none}
  .toast{

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  var LS = 'code-verdict-v1';

  /* ================= 存档 ================= */
  function loadArchive(){ try{ return JSON.parse(localStorage.getItem(LS)) || {cases:0}; }catch(e){ return {cases:0}; } }
  function saveArchive(a){ try{ localStorage.setItem(LS, JSON.stringify(a)); }catch(e){} }
  var archive = loadArchive();

  function toast(msg){
    var box = $('#toasts');
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function(){ el.classList.add('bye'); setTimeout(function(){ el.remove(); }, 350); }, 3000);
  }

  /* ================= 音效（惊堂木/盖印） ================= */
  var actx = null;
  function ac(){
    if(!actx){ var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; actx = new AC(); }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }
  function gavel(){
    var c = ac(); if(!c) return;
    var t = c.currentTime;
    [0, 0.14].forEach(function(off){
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(220, t + off);
      o.frequency.exponentialRampToValueAtTime(70, t + off + 0.08);
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.55, t + off + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.12);
      o.connect(g); g.connect(c.destination);
      o.start(t + off); o.stop(t + off + 0.14);
    });
  }
  function stampSfx(){
    var c = ac(); if(!c) return;
    var t = c.currentTime;
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.6, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.24);
  }

  /* ================= 样本 ================= */
  var SAMPLE = [

  /* ================= 解析 ================= */
  function parseLog(text){
    var lines = text.split(/\r?\n/);
    var commits = [];
    var author = null;
    var multi = lines.some(function(l){ return /^commit\s+[0-9a-f]{7,40}/i.test(l.trim()); });

    function pushCommit(msg, date){
      msg = (msg || '').replace(/\s+/g, ' ').trim();
      if(msg) commits.push({ msg: msg, date: date });
    }

    if(multi){
      var curMsg = [], curDate = null, inMsg = false;
      lines.forEach(function(raw){
        var l = raw.trim();
        if(/^commit\s+[0-9a-f]{7,40}/i.test(l)){
          pushCommit(curMsg.join(' '), curDate);
          curMsg = []; curDate = null; inMsg = false;
        } else if(/^Author:\s*([^<]+?)\s*(<|$)/i.test(l)){
          var am = l.match(/^Author:\s*([^<]+?)\s*(<|$)/i);
          if(!author && am && am[1]) author = am[1].trim();
          inMsg = false;
        } else if(/^Date:\s*(.+)$/i.test(l)){
          var dm = l.match(/^Date:\s*(.+)$/i);
          var d = dm ? new Date(dm[1].replace(/\s*\+\d{4}\s*$/, '')) : null;
          if(d && !isNaN(d.getTime())) curDate = d;
          inMsg = false;
        } else if(/^Merge:/i.test(l) || /^AuthorDate/i.test(l) || /^Commit:/i.test(l)){
          inMsg = false;
        } else if(l === ''){
          /* 空行：消息段间隔 */
        } else if(raw !== l){
          curMsg.push(l); inMsg = true;
        } else if(inMsg && curMsg.length){
          curMsg.push(l);
        }
      });
      pushCommit(curMsg.join(' '), curDate);
    } else {
      var dateRe = /(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[ T,]+(\d{1,2}):(\d{2})/;
      var relRe = /(\d+)\s*(分钟|小时|天|minutes?|mins?|hours?|hrs?|days?)\s*(前|ago)/i;
      lines.forEach(function(raw){
        var l = raw.trim();
        if(!l) return;
        var msg = l.replace(/^[|\*\s]*(commit\s+)?[0-9a-f]{7,40}\s*[-|:]?\s*/i, '');
        var d = null;
        var dm = msg.match(dateRe);
        if(dm){
          d = new Date(+dm[1], +dm[2] - 1, +dm[3], +dm[4], +dm[5]);
          msg = msg.replace(dateRe, '');
        } else {
          var rm = msg.match(relRe);
          if(rm){
            var n = +rm[1];
            var unit = rm[2].toLowerCase();
            var ms = /分|min/.test(unit) ? n * 60000 : /小|hour|hr/.test(unit) ? n * 3600000 : n * 86400000;
            d = new Date(Date.now() - ms);
            msg = msg.replace(relRe, '');
          }
        }
        msg = msg.replace(/^[\s\-|:,(]+/, '').replace(/\s*\(\d+\s*(年|个月)?前\)\s*$/, '').replace(/\s*\+\d{4}\s*$/, '').trim();
        if(msg) commits.push({ msg: msg, date: d });
      });
    }
    return { commits: commits, author: author };
  }

  /* ================= 罪名库 ================= */
  var SINS = [
    { id:'midnight',    name:'夜半潜行', text:'子时未过犹自提码，鬼祟行事，惊扰梦神', pts:2, cap:3 },
    { id:'lateNight',   name:'戌时未归', text:'戌时已至仍伏案，案牍劳形，恐折寿数', pts:1, cap:3 },
    { id:'lazyMsg',     name:'敷衍塞责', text:'呈词寥寥数字，搪塞圣听，视代码如儿戏', pts:2, cap:3 },
    { id:'wipForever',  name:'屡教不改', text:'WIP 层出不穷，戏言进退，视版本如敝履', pts:3, cap:1 },
    { id:'revertRevert',name:'出尔反尔', text:'朝令夕改，出尔反尔，一行代码三行悔', pts:3, cap:1 },
    { id:'finalFinal',  name:'名不副实', text:'「最终版」之后又有真·最终版，假传圣旨', pts:2, cap:1 },
    { id:'fridayFire',  name:'临阵纵火', text:'休沐前夕仓促提码，焚卷而逃，祸及周一', pts:2, cap:1 },
    { id:'weekendWork', name:'不守休沐', text:'休沐之日仍临朝写码，卷及同僚，其心可诛', pts:1, cap:1 },
    { id:'spamDay',     name:'一日千奏', text:'一日之内连发密奏，仓促结案，必藏隐患', pts:2, cap:1 },
    { id:'emptyWords',  name:'言之无物', text:'TODO/FIXME 满纸空言，留券后人，贻误苍生', pts:1, cap:1 },
    { id:'bragging',    name:'自吹自擂', text:'言称完美解决、永不复现，夸大其词，欺君罔上', pts:2, cap:1 },
    { id:'hedging',     name:'首鼠两端', text:'试试看、应该行……语焉不详，主审官无从定夺', pts:1, cap:1 },
    { id:'typoKing',    name:'手滑常客', text:'fix typo 屡见笔误，十指连心，字字泣血', pts:1, cap:1 },
    { id:'rapidFire',   name:'鬼祟连发', text:'三分钟内连珠密奏，鬼鬼祟祟，不知所云', pts:2, cap:1 }
  ];

  var RANKS = [
    { min:21,  rank:'十恶不赦', sentence:'发配 C 盘深处，与 System32 为邻，<b>永世不得 push</b>。' },
    { min:13,  rank:'江洋大盗', sentence:'流放祖传代码库，<b>永不叙用</b>，于无注释处自证清白。' },
    { min:6,   rank:'惯犯',     sentence:'廷杖二十，杖毕充当前端苦力，<b>负责兼容 IE6</b>。' },
    { min:1,   rank:'初犯',     sentence:'念其初犯，罚俸三月，择日抄写<b>《代码规范》十遍</b>。' },
    { min:0,   rank:'良民',     sentence:'查无实罪，赏<b>「当代好码民」</b>匾额一面，着即回衙，好生写码。' }
  ];

  /* ================= 审判引擎 ================= */
  function judge(commits){
    var counts = {};
    function hit(id, n){ counts[id] = (counts[id] || 0) + (n || 1); }

    var lazyRe = /^(fix|bug|update|修改|调整|test|tmp|aaa|done|ok|fixes?|bugfix)[.!?。！？]*$/i;
    var wipCount = 0, revertCount = 0, typoCount = 0;
    var dayBuckets = {};
    var sortedDates = [];

    commits.forEach(function(c){
      var msg = c.msg;
      var m = msg.toLowerCase();
      var d = c.date;

      if(d && !isNaN(d.getTime())){
        sortedDates.push(d);
        var h = d.getHours();
        if(h >= 0 && h < 5) hit('midnight');
        else if(h >= 22 && h < 24) hit('lateNight');
        var day = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
        dayBuckets[day] = (dayBuckets[day] || 0) + 1;
        var wd = d.getDay();
        if(wd === 5 && h >= 16) hit('fridayFire');
        if(wd === 0 || wd === 6) hit('weekendWork');
      }

      var bare = msg.replace(/[\s\W_]+/g, '');
      if(lazyRe.test(msg.replace(/\s+/g, '')) || bare.length < 3) hit('lazyMsg');
      if(/\bwip\b|\bw\.i\.p\b|working in progress/i.test(m)) wipCount++;
      if(/revert/i.test(m)) revertCount++;
      if(/typo/i.test(m)) typoCount++;
      if(/final|最终|再也不|最后一次|真的不改/i.test(m)) hit('finalFinal');
      if(/\btodo\b|\bfixme\b|待办|待补|占位/i.test(m)) hit('emptyWords');
      if(/完美|彻底解决|一劳永逸|永不再|永久修复/i.test(m)) hit('bragging');
      if(/试试|maybe|应该|大概|似乎|可能行/i.test(m)) hit('hedging');
    });

    if(wipCount >= 3) hit('wipForever');
    if(revertCount >= 2) hit('revertRevert');
    if(typoCount >= 2) hit('typoKing');

    var dayMax = 0;
    for(var k in dayBuckets){ if(dayBuckets[k] > dayMax) dayMax = dayBuckets[k]; }
    if(dayMax >= 8) hit('spamDay');

    sortedDates.sort(function(a, b){ return a - b; });
    var rapidPairs = 0;
    for(var i = 1; i < sortedDates.length; i++){
      if(sortedDates[i] - sortedDates[i - 1] <= 3 * 60000) rapidPairs++;
    }
    if(rapidPairs >= 2) hit('rapidFire');

    /* 计分（每罪封顶） */
    var sins = [], total = 0;
    SINS.forEach(function(s){
      var n = counts[s.id] || 0;
      if(n > 0){
        var eff = Math.min(n, s.cap);
        var pts = eff * s.pts;
        total += pts;
        sins.push({ def: s, count: n, pts: pts });
      }
    });
    sins.sort(function(a, b){ return b.pts - a.pts; });

    var dated = sortedDates.length;
    var midnightN = counts['midnight'] || 0, lateN = counts['lateNight'] || 0;
    var latestStr = '—';
    if(dated){
      /* 最晚提交 = 熬到最晚的时刻（凌晨比深夜更晚） */
      var latestNight = null;
      sortedDates.forEach(function(d){
        var h = d.getHours(), m = d.getMinutes();
        var off = (h >= 0 && h < 9) ? 24 + h : h;
        if(!latestNight || off > latestNight.off) latestNight = { off: off, h: h, m: m };
      });
      latestStr = (latestNight.h < 9 ? '凌晨 ' : '') + ('0' + latestNight.h).slice(-2) + ':' + ('0' + latestNight.m).slice(-2);
    }
    var evidence = {
      total: commits.length,
      nightPct: dated ? Math.round((midnightN + lateN) / dated * 100) : 0,
      lazyPct: commits.length ? Math.round((counts['lazyMsg'] || 0) / commits.length * 100) : 0,
      latest: latestStr
    };
    return { sins: sins, total: total, evidence: evidence };
  }

  function rankOf(score){
    for(var i = 0; i < RANKS.length; i++){ if(score >= RANKS[i].min) return RANKS[i]; }
    return RANKS[RANKS.length - 1];
  }

  /* ================= 罪己诏文案 ================= */
  function esc(s){ return String(s).replace(/[<>&"]/g, function(c){ return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]; }); }

  function buildDecree(name, v, verdict){
    var total = v.evidence.total;
    var sinList = v.sins.slice(0, 5).map(function(s){ return s.def.name; }).join('、');
    var years = Math.min(10, Math.max(0, Math.round(v.total / 2.5)));
    var term = years === 10 ? '改判无期，永世不得 push'
      : years === 0 ? '当庭训诫，免于刑罚'
      : '判有期徒刑 ' + years + ' 年，缓刑至下个迭代';
    var head = '<span class="first-char">奉天承运，码皇诏曰：</span>';
    var body =
      '今有大理寺卿查明：犯官「<span class="red">' + esc(name) + '</span>」' +
      '共提代码 <span class="red">' + total + '</span> 次，' +
      '其中深夜占比 ' + (v.evidence.nightPct) + '% 有余。' +
      (v.sins.length
        ? '经御史逐条过堂，坐实「<span class="red">' + esc(sinList) + '</span>」等 ' + v.sins.length + ' 项罪状，累计量刑 <span class="red">' + v.total + '</span> 等。'
        : '经御史逐条过堂，竟查无实罪，御史无不称奇。') +
      '念其提交皆为己任，未累他人，着从轻发落：' +
      '<span class="red">【' + verdict.rank + '】' + term + '。</span>' +
      '钦此。';
    return { html: head + body, term: term, years: years };
  }

  /* ================= 渲染 ================= */
  var lastVerdictText = '';
  function cnNum(n){
    var c = ['一','二','三','四','五','六','七','八','九','十'];
    if(n <= 10) return c[n - 1] || String(n);
    if(n < 20) return '十' + (c[n - 11] || '');
    return String(n);
  }

  function renderVerdict(name, v){
    var verdict = rankOf(v.total);
    var decree = buildDecree(name, v, verdict);

    var d = $('#decree');
    d.innerHTML = decree.html + '<div class="seal-stamp">大理寺<br>之印</div>';

    $('#vRank').textContent = '【' + verdict.rank + '】';
    $('#vSentence').innerHTML = verdict.sentence;

    var sinsEl = $('#sins');
    sinsEl.innerHTML = '';
    if(!v.sins.length){
      sinsEl.innerHTML = '<li class="sin"><div class="s-head"><span class="s-name">查无实罪</span></div><div class="s-text">御史翻遍状纸，未寻得半条罪状。此等清白，本寺少见，望保持。</div></li>';
    } else {
      v.sins.forEach(function(s, i){
        var li = document.createElement('li');
        li.className = 'sin';
        li.style.animationDelay = (0.15 + i * 0.12) + 's';
        li.innerHTML =
          '<div class="s-head"><span class="s-name">罪状' + cnNum(i + 1) + ' · <b>' + s.def.name + '</b></span>' +
          '<span class="s-count">证供 ' + s.count + ' 次</span></div>' +
          '<div class="s-text">「' + s.def.text + '」</div>' +
          '<div class="s-pts">量刑 ' + s.pts + ' 等</div>';
        sinsEl.appendChild(li);
      });
    }

    $('#evidence').innerHTML =
      '<div class="ev"><b>' + v.evidence.total + '</b><span>提交次数</span></div>' +
      '<div class="ev"><b>' + v.evidence.nightPct + '%</b><span>深夜占比</span></div>' +
      '<div class="ev"><b>' + v.evidence.lazyPct + '%</b><span>敷衍率</span></div>' +
      '<div class="ev"><b>' + v.evidence.latest + '</b><span>最晚提交</span></div>';

    $('#verdictView').classList.add('on');
    $('#verdictView').scrollIntoView({ behavior: 'smooth', block: 'start' });

    setTimeout(stampSfx, 600);

    lastVerdictText =
      '⚖️ 代码罪己诏 · 大理寺终审判决\n' +
      '犯官：【' + name + '】\n' +
      '提交 ' + v.evidence.total + ' 次 · 深夜占比 ' + v.evidence.nightPct + '% · 敷衍率 ' + v.evidence.lazyPct + '%\n' +
      (v.sins.length ? '罪状：' + v.sins.map(function(s){ return s.def.name + '×' + s.count; }).join('、') + '\n量刑合计 ' + v.total + ' 等\n' : '罪状：查无实罪\n') +
      '判决：【' + verdict.rank + '】' + decree.term + '\n' +
      '（代码无罪，罪在提交——把你的 git log 拖进大理寺试试）';
  }

  /* ================= 开堂 ================= */
  function holdCourt(useSample){
    var text = useSample ? SAMPLE : $('#paper').value;
    if(useSample){ $('#paper').value = SAMPLE; }
    if(!text.trim()){ toast('状纸空白，刁民闹堂？先粘贴 git log 或用样本'); return; }

    $('#court').classList.add('striking');
    gavel();
    setTimeout(function(){ $('#court').classList.remove('striking'); }, 1100);

    var parsed = parseLog(text);
    var name = $('#nameInput').value.trim() || parsed.author || '无名码民';
    if(!parsed.commits.length){
      toast('这状纸不是 git log，大理寺不收——试试样本');
      return;
    }
    var v = judge(parsed.commits);
    archive.cases++;
    saveArchive(archive);
    renderArchive();
    setTimeout(function(){ renderVerdict(name, v); }, 450);
  }
  function renderArchive(){ $('#archive').innerHTML = '本寺已断 <b>' + archive.cases + '</b> 案'; }

  /* ================= 事件 ================= */
  $('#btn-judge').addEventListener('click', function(){ holdCourt(false); });
  $('#btn-sample').addEventListener('click', function(){ holdCourt(true); });
  $('#btn-clear').addEventListener('click', function(){
    $('#paper').value = ''; $('#paper').focus(); toast('状纸已焚，重写吧');
  });
  $('#btn-again').addEventListener('click', function(){
    $('#verdictView').classList.remove('on');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    $('#paper').focus();
  });
  $('#btn-copy').addEventListener('click', function(){ copyText(lastVerdictText); });
  function copyText(t){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ toast('罪己诏已抄录，去晒吧 📋'); },
        function(){ fallbackCopy(t); });
    } else { fallbackCopy(t); }
  }
  function fallbackCopy(t){
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('罪己诏已抄录，去晒吧 📋'); }
    catch(e){ toast('复制失败，长按手动抄录'); }
    ta.remove();
  }

  /* 拖拽 git log 文本进堂 */
  ['dragover', 'drop'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, false);
  });
  document.addEventListener('drop', function(e){
    var t = e.dataTransfer.getData('text/plain');
    if(typeof t === 'string' && t.trim()){
      $('#paper').value = t;
      toast('状纸已收，开堂吧');
    }
  }, false);

  renderArchive();
})();
</script>
</body>
